ef="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></span></div></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>fetch('/api/config').then(r=>r.json()).then(c=>{window.SUPABASE_URL=c.url;window.SUPABASE_ANON_KEY=c.anonKey});</script><script src="/assets/js/supabase-client.js"></script><script>const sid=new URLSearchParams(location.search).get("session_id");async function check(){try{const c=await initSupabase();const {data:{user}}=await c.auth.getUser();if(!user){document.getElementById("m").innerHTML='<div class="notice">Payment received. Sign in to view your purchase.</div>';return}const {data}=await c.from("orders").select("status,product_name").eq("provider_session_id",sid).maybeSingle();if(data?.status==="paid")document.getElementById("m").innerHTML='<div class="notice">Payment confirmed for '+data.product_name+'. Access is ready.</div>';else setTimeout(check,1500)}catch(e){setTimeout(check,2000)}}check()</script></body></html>
