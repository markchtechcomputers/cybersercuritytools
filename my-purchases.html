f="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></span></div></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>fetch('/api/config').then(r=>r.json()).then(c=>{window.SUPABASE_URL=c.url;window.SUPABASE_ANON_KEY=c.anonKey});</script><script src="/assets/js/supabase-client.js"></script><script src="/assets/js/app.js"></script><script>const PRODUCTS='+pjson+';(async()=>{try{const u=await requireUser();if(!u)return;const c=await waitForSupabase();const {data,error}=await c.from("orders").select("id,product_id,product_name,amount_kes,status,paid_at,created_at").eq("user_id",u.id).order("created_at",{ascending:false});if(error)throw error;const list=document.getElementById("list");if(!data.length){list.innerHTML='<div class="standard-card">No purchases yet. <a href="/training.html">Browse products →</a></div>';return}list.innerHTML=data.map(o=>{const p=PRODUCTS.find(x=>x.id===o.product_id);const action=o.status==="paid"?(p?.type==="download"?`<button class="btn-signal download-btn" data-product="${o.product_id}">Download</button>`:`<a class="btn-signal" href="/course-access.html?product=${encodeURIComponent(o.product_id)}">Open course</a>`):'<span class="btn-outline-signal">Payment pending</span>';return `<div class="purchase"><div><strong>${o.product_name}</strong><div class="small text-muted-slate">KES ${Number(o.amount_kes).toLocaleString()} · ${o.status}</div></div><div>${action}</div></div>`}).join("")}catch(e){document.getElementById("m").innerHTML='<div class="error">'+e.message+'</div>'}})();document.addEventListener("click",async e=>{const b=e.target.closest(".download-btn");if(!b)return;try{b.disabled=true;b.textContent="Preparing…";const h=await authHeader();const r=await fetch("/api/download?product="+encodeURIComponent(b.dataset.product),{headers:h});const d=await r.json();if(!r.ok)throw Error(d.error);location.href=d.url}catch(x){alert(x.message);b.disabled=false;b.textContent="Download"}})</scri
