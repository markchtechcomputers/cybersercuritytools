<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#115e59"><link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="/assets/css/tokens.css"><link rel="stylesheet" href="/assets/css/style.css"><title>Create account — Meridian Cyber</title></head><body><a href="#main-content" class="skip-link">Skip to main content</a><nav class="site-nav"><div class="container-narrow py-2 d-flex align-items-center flex-wrap"><a class="brand-mark me-4" href="/"><span class="glyph">MC</span><span>Meridian Cyber</span></a><div class="d-flex flex-wrap gap-2 ms-auto align-items-center"><a class="nav-link" href="/">Home</a><a class="nav-link" href="/training.html">Training & Tools</a><a class="nav-link" href="/services.html">Consulting</a><a class="nav-link" href="/ctf.html">CTF Practice</a><a class="nav-link" href="/faq.html">FAQ</a><a class="btn-outline-signal" href="/my-purchases.html">My Purchases</a><a class="btn-signal" href="/login.html">Sign in</a></div></div></nav><main id="main-content"><section class="auth-wrap"><form class="auth-card" id="f"><h1>Create your account</h1><p class="text-muted-slate">Your account keeps purchased products available to you.</p><div id="m"></div><label class="form-group">Email<input id="email" class="form-control" type="email" required></label><label class="form-group">Password<input id="password" class="form-control" type="password" minlength="8" required></label><button class="btn-signal w-100">Create account</button><p class="mt-3">Already registered? <a href="/login.html">Sign in</a></p></form></section></main><footer class="section-tight"><div class="container-narrow"><div class="standard-card d-flex justify-content-between flex-wrap gap-3"><span>© 2026 Meridian Cyber</span><span><a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></span></div></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>fetch('/api/config').then(r=>r.json()).then(c=>{window.SUPABASE_URL=c.url;window.SUPABASE_ANON_KEY=c.anonKey});</script><script src="/assets/js/supabase-client.js"></script><script src="/assets/js/app.js"></script><script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();try{const c=await waitForSupabase();const {error}=await c.auth.signUp({email:document.getElementById("email").value,password:document.getElementById("password").value});if(error)throw error;document.getElementById("m").innerHTML='<div class="notice">Account created. Check your email if confirmation is enabled.</div>'}catch(x){document.getElementById("m").innerHTML='<div class="error">'+x.message+'</div>'}}</script></body></html>
